# docker compose up -d      -> API on http://localhost:8000/docs
# First run pulls the model into the ollama volume (needs internet once; fully offline after).
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
    # Uncomment on a machine with an NVIDIA GPU + nvidia-container-toolkit
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  model-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["ollama", "pull", "${FIELDMATE_MODEL:-qwen2.5:3b}"]
    restart: "no"

  app:
    build: .
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - FIELDMATE_MODEL=${FIELDMATE_MODEL:-qwen2.5:3b}
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  ollama-models:
