name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + unit tests (offline, Ollama mocked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt && pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  docker:
    name: docker build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fieldmate:ci .
      - name: container starts and serves the API schema (no Ollama in CI, so /health would be 503)
        run: |
          docker run -d --name fm -p 8000:8000 fieldmate:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/openapi.json > /dev/null && break; sleep 1; done
          curl -sf localhost:8000/openapi.json | python3 -c "import json,sys; print(sorted(json.load(sys.stdin)['paths']))"
