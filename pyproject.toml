[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldmate"
version = "0.1.0"
description = "Offline drone-operations assistant on small language models (Ollama): structured extraction, Q&A, and a reproducible benchmark suite."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rakesh Burla", email = "burlarakesh1458@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "typer==0.27.3",
  "httpx==0.28.1",
  "pydantic==2.14.3",
  "psutil==7.2.2",
]

[project.optional-dependencies]
bench = ["matplotlib==3.11.2", "numpy==2.5.4"]
dev = ["pytest==9.2.0", "ruff==0.17.4", "matplotlib==3.11.2", "numpy==2.5.4"]

[project.scripts]
fieldmate = "fieldmate.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "RUF001"]  # B008: typer/fastapi defaults are idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]
